<!-- Main Content -->
<main class="flex-1 flex items-center justify-center p-6 z-10">
<div class="w-full max-w-md">
<!-- Branding Container -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center mb-6">
<div class="w-12 h-12 rounded-xl bg-gradient-to-br from-primary to-primary-container flex items-center justify-center shadow-[0px_0px_32px_rgba(173,198,255,0.2)]">
<span class="material-symbols-outlined text-on-primary text-3xl" data-icon="light_mode">light_mode</span>
</div>
</div>
<h1 class="font-headline text-3xl font-extrabold tracking-tighter text-on-surface mb-2">Lumiere IoT</h1>
<p class="font-headline text-sm font-medium tracking-[0.2em] uppercase text-primary/70">The Nocturne Protocol</p>
</div>
<!-- Login Card -->
<div class="glass-panel border border-outline-variant/15 rounded-full p-10 shadow-[0px_0px_32px_rgba(173,198,255,0.06)] relative overflow-hidden">
<div class="mb-8">

<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">

<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg" data-icon="alternate_email">alternate_email</span>
</div>
<input class="block w-full bg-surface-container-lowest border-0 rounded-xl py-4 pl-12 pr-4 text-on-surface placeholder:text-outline/50 focus:ring-0 focus:bg-surface-bright transition-all duration-300" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block text-xs font-label font-semibold text-primary/80 uppercase tracking-wider" for="password">Password</label>
<a class="text-xs font-label text-outline hover:text-primary transition-colors" href="#">Mot de passe oublié ?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg" data-icon="lock">lock</span>
</div>
<input class="block w-full bg-surface-container-lowest border-0 rounded-xl py-4 pl-12 pr-4 text-on-surface placeholder:text-outline/50 focus:ring-0 focus:bg-surface-bright transition-all duration-300" id="password" name="password" placeholder="••••••••" type="password"/>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center">
<button class="text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-lg" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>

<button class="w-full bg-gradient-to-r from-primary to-primary-container hover:brightness-110 text-on-primary-container font-headline font-bold py-4 rounded-full transition-all duration-300 shadow-lg shadow-primary/10 active:scale-[0.98]" type="submit">
                            Connexion
                        </button>
</div>
<div class="text-center pt-2">
<p class="text-sm text-on-surface-variant">
                            Nouveau sur la plateforme ? 
                            <a class="text-primary font-semibold hover:underline decoration-2 underline-offset-4 ml-1" href="#">Créer un compte</a>
</p>
</div>
</form>
</div>
<!-- Footer Footer -->
<div class="mt-12 flex items-center justify-between px-4">

</svg>
</div>
</div>
</div>
<!-- Aesthetic Visual Elements -->
<div class="fixed bottom-0 left-0 p-12 opacity-10 pointer-events-none select-none">
<div class="font-headline text-[120px] font-black tracking-tighter leading-none text-on-surface/5">LUMIERE</div>
</div>
<script>
  (function () {
    const routes = {
      login: "index.html",
      register: "inscription.html",
      dashboard: "dashboard.html",
      sensors: "capteurs.html",
      settings: "parametres.html",
      map: "plan.html"
    };

    const normalize = (value) =>
      (value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();

    const detectRoute = (text) => {
      const t = normalize(text);
      if (t.includes("creer un compte") || t.includes("create account") || t.includes("inscription")) return "register";
      if (t.includes("connectez") || t.includes("connexion") || t.includes("login") || t.includes("logout")) return "login";
      if (t.includes("overview") || t.includes("dashboard") || t.includes("live status") || t.includes("archive")) return "dashboard";
      if (t.includes("floor map") || t.includes(" map") || t === "map") return "map";
      if (t.includes("sensor") || t.includes("capteur") || t.includes("devices")) return "sensors";
      if (t.includes("setting") || t.includes("configuration") || t.includes("admin")) return "settings";
      return null;
    };

    const goTo = (route) => {
      window.location.href = routes[route];
    };

    document.querySelectorAll('a[href="#"]').forEach((anchor) => {
      const route = detectRoute(anchor.textContent);
      if (route) {
        anchor.href = routes[route];
      } else {
        anchor.addEventListener("click", (event) => {
          event.preventDefault();
          alert("Fonctionnalite de demonstration.");
        });
      }
    });

    document.querySelectorAll("form").forEach((form) => {
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        goTo("dashboard");
      });
    });

    document.querySelectorAll("button").forEach((button) => {
      if (button.type === "submit") return;

      const text = normalize(button.textContent);
      const route = detectRoute(text);

      if (text.includes("deploy new trap") || text.includes("expand map view")) {
        button.addEventListener("click", () => goTo("map"));
        return;
      }

      if (text.includes("support")) {
        button.addEventListener("click", () => {
          window.location.href = "mailto:support@lumiere-iot.local";
        });
        return;
      }

      if (route) {
        button.addEventListener("click", () => goTo(route));
        return;
      }

      button.addEventListener("click", () => {
        alert("Action executee en mode demo.");
      });
    });
  })();
</script>
</body></html>
