<!DOCTYPE html>
<html class="dark" lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <title>Change Password</title>
</head>
<body class="bg-[#0b1326] text-[#dae2fd] min-h-screen font-['Inter']">
  <header></header>
  <main class="max-w-3xl mx-auto p-8">
    <a href="dashboard.html" class="text-sm text-[#adc6ff] hover:underline">&larr; Retour au tableau de bord</a>
    <section class="mt-6 rounded-2xl border border-[#424754]/40 bg-[#171f33] p-8">
      <h1 class="text-3xl font-black font-['Manrope']">Changer le mot de passe</h1>
      <form id="password-form" class="mt-8 grid gap-4">
        <input id="current" type="password" placeholder="Mot de passe actuel" class="rounded-xl border-none bg-[#060e20]" required />
        <input id="next" type="password" placeholder="Nouveau mot de passe" class="rounded-xl border-none bg-[#060e20]" required />
        <input id="confirm" type="password" placeholder="Confirmer le mot de passe" class="rounded-xl border-none bg-[#060e20]" required />
        <div class="mt-4 flex justify-end">
          <button type="submit" class="px-6 py-2 rounded-full bg-gradient-to-r from-[#adc6ff] to-[#4d8eff] text-[#002e6a] font-bold">Mettre a jour</button>
        </div>
      </form>
    </section>
  </main>
  <script src="topbar.js"></script>
  <script>
    document.getElementById("password-form").addEventListener("submit", function (event) {
      event.preventDefault();
      var next = document.getElementById("next").value;
      var confirm = document.getElementById("confirm").value;
      if (next !== confirm) {
        alert("Les mots de passe ne correspondent pas.");
        return;
      }
      localStorage.setItem("legacy-password-updated-at", new Date().toISOString());
      alert("Mot de passe mis a jour.");
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
